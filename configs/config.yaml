# Data coverage and research assumptions are documented in report/data_methodology.md.
project:
  phase: replication_and_extension
  seed: 4576
sample:
  download_start: "1969-01-01"
  paper_start: "1970-01-01"
  paper_end: "2011-09-30"
  proposed_wrds_start: "2000-01-01"
  proposed_wrds_end: "2025-12-31"
  active_sample: paper
data_preparation:
  max_quote_age_days: 7
  primary_notice_policy: appendix_conventions
universe:
  agriculture: [Barley, Cocoa, Coffee, Corn, Cotton, Lumber, Oats, Orange juice, Rough rice, Soybeans, Soybean meal, Soybean oil, Sugar, Wheat]
  energy: [Crude oil, Heating oil, Natural gas, Propane, RBOB gasoline, Unleaded gasoline]
  livestock: [Feeder cattle, Lean hogs, Live cattle, Pork belly]
  metals: [Copper, Gold, Palladium, Platinum, Silver]
factors:
  carry_leg_size: 5
  momentum_leg_size: 5
  momentum_lookback_months: 6
estimation:
  gmm_weighting: identity
  hac_lag_selection: newey_west_1994
  bootstrap_iterations: 10000
extension:
  rolling_windows_months: [120, 180]
  rolling_step_months: 12
  block_length_months: 12
  local_bootstrap_draws: 199
  main_bootstrap_draws: 499
  break_bootstrap_draws: 999
  vix_primary_threshold: paper_sample_median
  robust_carry_test_assets: full_slope_quartiles
paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  replication: results/replication
  extension: results/extension
